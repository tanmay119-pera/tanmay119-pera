<svg viewBox="0 0 880 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cardBg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#0E1B2E" />
      <stop offset="50%" stop-color="#070C16" />
      <stop offset="100%" stop-color="#04060A" />
    </radialGradient>

    <!-- Category Box Background -->
    <linearGradient id="boxBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1626" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#060C16" stop-opacity="0.9" />
    </linearGradient>

    <!-- Pill Background -->
    <linearGradient id="pillBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E1E34" />
      <stop offset="100%" stop-color="#081322" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== OUTER FRAME ==================== -->
  <rect x="2" y="2" width="876" height="476" rx="16" fill="url(#cardBg)" stroke="#162E4E" stroke-width="1.6"/>
  <path d="M 32 2 L 340 2" stroke="#00D4FF" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(36, 26)">
    <!-- Wrench/Chip Badge Icon -->
    <circle cx="17" cy="17" r="16" fill="#0A182B" stroke="#00D4FF" stroke-width="1.4"/>
    <!-- Circuit CPU Icon -->
    <path d="M12 10h10v10H12zM9 13h3m-3 4h3m10-4h3m-3 4h3M13 9v3m4-3v3m-4 10v3m4-3v3" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="82" y="41" fill="#00D4FF" font-size="20" font-weight="900" letter-spacing="1.8" filter="url(#neonGlow)">TECH ARSENAL &amp; STACK</text>
  <text x="82" y="58" fill="#94A3B8" font-size="12" font-weight="600">Autonomous AI Intelligence • Low-Level Systems • Production Curricula</text>

  <!-- Tag Pill Top Right -->
  <g transform="translate(680, 24)">
    <rect x="0" y="0" width="164" height="34" rx="17" fill="#081426" stroke="#00D4FF" stroke-width="1"/>
    <circle cx="16" cy="17" r="4" fill="#00D4FF" filter="url(#cyanGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="21" fill="#00D4FF" font-size="11.5" font-weight="800" letter-spacing="0.5">AGENTIC STACK 2026</text>
  </g>

  <!-- ==================== CATEGORY 1: AUTONOMOUS AI & AGENTIC STACK ==================== -->
  <g transform="translate(26, 76)">
    <rect x="0" y="0" width="828" height="114" rx="10" fill="url(#boxBg)" stroke="#162E4E" stroke-width="1.2"/>
    
    <!-- Category Header -->
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="6" height="16" rx="3" fill="#00D4FF" filter="url(#cyanGlow)"/>
      <text x="14" y="13" fill="#E2E8F0" font-size="13" font-weight="800" letter-spacing="0.8">🤖 AUTONOMOUS AI &amp; MULTI-AGENT INTELLIGENCE</text>
    </g>

    <!-- AI Pills Grid (Row 1: 3 pills, Row 2: 3 pills) -->
    <!-- Pill 1: OpenAI -->
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="258" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#00D4FF" fill-opacity="0.15"/>
      <path d="M16 11l3 1.8v3.6L16 18.2l-3-1.8v-3.6z" stroke="#00D4FF" stroke-width="1.2" fill="none"/>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">OpenAI API</text>
      <text x="110" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Function Calling &amp; GPT-4o</text>
    </g>

    <!-- Pill 2: LangChain -->
    <g transform="translate(284, 42)">
      <rect x="0" y="0" width="258" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#38BDF8" fill-opacity="0.15"/>
      <path d="M12 15h8M16 11v8" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round"/>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">LangChain</text>
      <text x="106" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Agent Loops &amp; Tool RAG</text>
    </g>

    <!-- Pill 3: PyTorch -->
    <g transform="translate(550, 42)">
      <rect x="0" y="0" width="260" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#00D4FF" fill-opacity="0.15"/>
      <path d="M16 10l2 2a3 3 0 01-4 4 3 3 0 012-6z" fill="#00D4FF"/>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">PyTorch</text>
      <text x="90" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Tensors &amp; Deep Neural Nets</text>
    </g>

    <!-- Row 2 -->
    <!-- Pill 4: TensorFlow -->
    <g transform="translate(18, 76)">
      <rect x="0" y="0" width="258" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#00D4FF" fill-opacity="0.15"/>
      <path d="M12 12h8m-4 0v6" stroke="#00D4FF" stroke-width="1.4" stroke-linecap="round"/>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">TensorFlow</text>
      <text x="110" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Graph Pipeline &amp; Models</text>
    </g>

    <!-- Pill 5: Scikit-Learn -->
    <g transform="translate(284, 76)">
      <rect x="0" y="0" width="258" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#38BDF8" fill-opacity="0.15"/>
      <circle cx="14" cy="15" r="2.5" fill="#38BDF8"/>
      <circle cx="19" cy="13" r="2" fill="#00D4FF"/>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">Scikit-Learn</text>
      <text x="114" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Regression &amp; Clustering</text>
    </g>

    <!-- Pill 6: Hugging Face -->
    <g transform="translate(550, 76)">
      <rect x="0" y="0" width="260" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#00D4FF" fill-opacity="0.15"/>
      <circle cx="14" cy="14" r="1.5" fill="#00D4FF"/>
      <circle cx="18" cy="14" r="1.5" fill="#00D4FF"/>
      <path d="M13 17c1 1 5 1 6 0" stroke="#00D4FF" stroke-width="1.2" stroke-linecap="round"/>
