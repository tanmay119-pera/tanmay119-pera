    <!-- Row 1: C, Python, C++ -->
    <!-- Pill 1: C -->
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="258" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#00D4FF" fill-opacity="0.15"/>
      <text x="13" y="19" fill="#00D4FF" font-size="11" font-weight="900">C</text>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">C Language</text>
      <text x="110" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Pointers, Memory &amp; Sockets</text>
    </g>

    <!-- Pill 2: Python -->
    <g transform="translate(284, 42)">
      <rect x="0" y="0" width="258" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#38BDF8" fill-opacity="0.15"/>
      <path d="M13 12c0-1.1.9-2 2-2h2v2h-2v1h3v2c0 1.1-.9 2-2 2h-2v-2h2v-1h-3v-2z" fill="#38BDF8"/>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">Python</text>
      <text x="82" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Automation, OOP &amp; Data</text>
    </g>

    <!-- Pill 3: C++ -->
    <g transform="translate(550, 42)">
      <rect x="0" y="0" width="260" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#00D4FF" fill-opacity="0.15"/>
      <text x="9" y="19" fill="#00D4FF" font-size="10" font-weight="900">C++</text>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">C++</text>
      <text x="66" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Fast Objects &amp; Algorithms</text>
    </g>

    <!-- Row 2: JavaScript, CSS3 & HTML5 -->
    <!-- Pill 4: JavaScript -->
    <g transform="translate(18, 76)">
      <rect x="0" y="0" width="258" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#00D4FF" fill-opacity="0.15"/>
      <text x="11" y="19" fill="#00D4FF" font-size="10" font-weight="900">JS</text>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">JavaScript</text>
      <text x="104" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• ES6+, Async &amp; DOM</text>
    </g>

    <!-- Pill 5: CSS3 Architecture -->
    <g transform="translate(284, 76)">
      <rect x="0" y="0" width="258" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#38BDF8" fill-opacity="0.15"/>
      <path d="M12 11l1 7 3 1 3-1 1-7z" stroke="#38BDF8" stroke-width="1.2" fill="none"/>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">CSS3 Master</text>
      <text x="120" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Flexbox, Grid &amp; FX</text>
    </g>

    <!-- Pill 6: HTML5 Semantics -->
    <g transform="translate(550, 76)">
      <rect x="0" y="0" width="260" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#00D4FF" fill-opacity="0.15"/>
      <path d="M12 11l1 7 3 1 3-1 1-7z" stroke="#00D4FF" stroke-width="1.2" fill="none"/>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">HTML5</text>
      <text x="82" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Semantic Web &amp; Forms</text>
    </g>
  </g>

  <!-- ==================== CATEGORY 3: TOOLING & DATA ECOSYSTEM ==================== -->
  <g transform="translate(26, 328)">
    <rect x="0" y="0" width="828" height="126" rx="10" fill="url(#boxBg)" stroke="#162E4E" stroke-width="1.2"/>
    
    <!-- Category Header -->
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="6" height="16" rx="3" fill="#00D4FF" filter="url(#cyanGlow)"/>
      <text x="14" y="13" fill="#E2E8F0" font-size="13" font-weight="800" letter-spacing="0.8">🧰 DEVELOPER ENVIRONMENT, DATA &amp; TOOLING</text>
    </g>

    <!-- Row 1: Git & GitHub, VS Code, Linux -->
    <!-- Pill 1: Git & GitHub -->
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="258" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#00D4FF" fill-opacity="0.15"/>
      <circle cx="13" cy="13" r="1.8" fill="#00D4FF"/>
      <circle cx="19" cy="17" r="1.8" fill="#00D4FF"/>
      <path d="M13 13v4m0 0l6 0" stroke="#00D4FF" stroke-width="1.2"/>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">Git &amp; GitHub</text>
      <text x="114" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Workflows &amp; Actions</text>
    </g>

    <!-- Pill 2: VS Code -->
    <g transform="translate(284, 42)">
      <rect x="0" y="0" width="258" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#38BDF8" fill-opacity="0.15"/>
      <path d="M12 17l4-2-4-2z" fill="#38BDF8"/>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">VS Code</text>
      <text x="92" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Agentic Development</text>
    </g>

    <!-- Pill 3: NumPy & Pandas -->
    <g transform="translate(550, 42)">
      <rect x="0" y="0" width="260" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#00D4FF" fill-opacity="0.15"/>
      <rect x="12" y="12" width="8" height="6" fill="none" stroke="#00D4FF" stroke-width="1.2"/>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">NumPy &amp; Pandas</text>
      <text x="142" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Vector Math</text>
    </g>

    <!-- Row 2: Jupyter, Linux Shell, Zero-Dependency -->
    <!-- Pill 4: Jupyter Notebooks -->
    <g transform="translate(18, 78)">
      <rect x="0" y="0" width="258" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#00D4FF" fill-opacity="0.15"/>
      <circle cx="16" cy="15" r="2.5" fill="#00D4FF"/>
      <circle cx="11" cy="12" r="1" fill="#00D4FF"/>
      <circle cx="21" cy="18" r="1" fill="#00D4FF"/>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">Jupyter</text>
      <text x="82" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Exploratory AI &amp; Testing</text>
    </g>

    <!-- Pill 5: Linux / macOS -->
    <g transform="translate(284, 78)">
      <rect x="0" y="0" width="258" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#38BDF8" fill-opacity="0.15"/>
      <path d="M12 16l3-3-3-3m3 6h4" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round"/>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">Linux &amp; macOS</text>
      <text x="134" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• CLI &amp; POSIX</text>
    </g>

    <!-- Pill 6: Zero-Dependency Architecture -->
    <g transform="translate(550, 78)">
      <rect x="0" y="0" width="260" height="30" rx="6" fill="url(#pillBg)" stroke="#1A365D" stroke-width="1"/>
      <circle cx="16" cy="15" r="7" fill="#00D4FF" fill-opacity="0.15"/>
      <path d="M13 15l2 2 4-4" stroke="#00D4FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="19" fill="#FFFFFF" font-size="12" font-weight="700">Zero-Dependency</text>
      <text x="146" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Systems Code</text>
    </g>
