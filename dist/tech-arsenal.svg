      <text x="122" y="19" fill="#38BDF8" font-size="10.5" font-weight="600">• Open Transformers</text>
    </g>
  </g>

  <!-- ==================== CATEGORY 2: CORE SYSTEMS & LANGUAGES ==================== -->
  <g transform="translate(26, 202)">
    <rect x="0" y="0" width="828" height="114" rx="10" fill="url(#boxBg)" stroke="#162E4E" stroke-width="1.2"/>
    
    <!-- Category Header -->
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="6" height="16" rx="3" fill="#38BDF8" filter="url(#cyanGlow)"/>
      <text x="14" y="13" fill="#E2E8F0" font-size="13" font-weight="800" letter-spacing="0.8">💻 LOW-LEVEL SYSTEMS &amp; CORE PROGRAMMING</text>
