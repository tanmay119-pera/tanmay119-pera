name: Update jet heatmap SVG

on:
  schedule:
    # Automatically updates every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - "dist/**"
      - "README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate updated jet SVG
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: dist/github-jet.svg
        run: node generate.mjs

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/github-jet.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update contribution jet SVG [automated]"
            git push
          else
            echo "No changes in contribution graph."
          fi

      # Ensures GitHub never disables this scheduled workflow due to repository inactivity
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
        if: always()
